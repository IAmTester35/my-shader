# ==============================================================================
# Celestial & Weather Shader Configuration GUI (Iris & Fabulously Optimized)
# ==============================================================================

# Iris Performance Profiles (Fabulously Optimized Quick Presets)
profiles = LOW MEDIUM HIGH ULTRA

profile.LOW = VOLUMETRIC_CLOUD_STEPS:12 CLOUD_LAYERS:1 STARS_DENSITY:0.75 GODRAYS:false AURORA_BOREALIS:false METEOR_SHOWERS:false MILKY_WAY_BRIGHTNESS:0.6
profile.MEDIUM = VOLUMETRIC_CLOUD_STEPS:16 CLOUD_LAYERS:1 STARS_DENSITY:1.0 GODRAYS:true AURORA_BOREALIS:true METEOR_SHOWERS:true MILKY_WAY_BRIGHTNESS:0.75
profile.HIGH = VOLUMETRIC_CLOUD_STEPS:20 CLOUD_LAYERS:2 STARS_DENSITY:1.2 GODRAYS:true AURORA_BOREALIS:true METEOR_SHOWERS:true MILKY_WAY_BRIGHTNESS:0.75
profile.ULTRA = VOLUMETRIC_CLOUD_STEPS:32 CLOUD_LAYERS:2 STARS_DENSITY:1.5 GODRAYS:true AURORA_BOREALIS:true METEOR_SHOWERS:true MILKY_WAY_BRIGHTNESS:0.85

profile.default = HIGH

# Iris Fast Render & Buffer Directives
colortex0Format = RGBA16F
colortex0Clear = true

# Main Screen Layout
screen=BIOME_SCREEN SKY_SCREEN SUN_SCREEN MOON_SCREEN CLOUD_SCREEN WEATHER_SCREEN POST_SCREEN

# Category Screens
screen.BIOME_SCREEN=BIOME_ADAPTATION DESERT_SANDSTORM
screen.BIOME_SCREEN.comment=Configure biome-aware climate, atmospheric tinting, and desert sandstorms.

screen.SKY_SCREEN=ATMOSPHERE_DENSITY RAYLEIGH_SCATTERING MIE_SCATTERING OZONE_ABSORPTION SKY_GROUND_FOG
screen.SKY_SCREEN.comment=Configure Rayleigh and Mie atmospheric scattering, Chappuis ozone twilight, and horizon haze.

# Custom Textures (NASA SVS 4851 Deep Star Maps & Blue Noise)
texture.milkyway=/textures/milkyway.png
texture.constellations=/textures/constellations.png
texture.celestialgrid=/textures/celestialgrid.png
texture.noisetex=/textures/noisetex.png

screen.SUN_SCREEN=ENABLE_SUN SUN_SIZE SUN_LIMB_DARKENING SUN_CORONA_INTENSITY SUN_GLARE SOLAR_DIFFRACTION_SPIKES GODRAYS GODRAYS_INTENSITY
screen.SUN_SCREEN.comment=Configure procedural solar disc, limb darkening, corona glow, diffraction spikes, and god rays.

screen.MOON_SCREEN=ENABLE_MOON MOON_SIZE MOON_PHASES MOON_SURFACE_DETAIL MOON_EARTHSHINE MOON_HALO MOON_HALO_INTENSITY ENABLE_STARS STARS_DENSITY STARS_TWINKLE STARS_COLOR_VARIETY NASA_SVS_MILKY_WAY MILKY_WAY MILKY_WAY_BRIGHTNESS CONSTELLATION_FIGURES CONSTELLATION_INTENSITY CELESTIAL_GRID CELESTIAL_GRID_INTENSITY CELESTIAL_LATITUDE METEOR_SHOWERS AURORA_BOREALIS AURORA_INTENSITY
screen.MOON_SCREEN.comment=Configure moon, stars, NASA SVS 4851 Deep Star Maps, constellation figures, celestial grid, meteors, and auroras.

screen.CLOUD_SCREEN=ENABLE_CLOUDS VOLUMETRIC_3D_CLOUDS VOLUMETRIC_CLOUD_STEPS CLOUD_LAYERS CLOUD_SPEED CLOUD_DENSITY CLOUD_SILVER_LINING CLOUD_SHADOWING
screen.CLOUD_SCREEN.comment=Configure true 3D raymarched volumetric clouds, raymarch sample count, wind speed, silver lining, and self-shadowing.

screen.WEATHER_SCREEN=DYNAMIC_WEATHER RAIN_FOG_DENSITY STORM_LIGHTNING DESERT_SANDSTORM RAIN_STREAKS WETNESS_EFFECT
screen.WEATHER_SCREEN.comment=Configure rain fog, procedural thunderstorm lightning flashes, desert sandstorms, wet surfaces, and raindrop optics.

screen.POST_SCREEN=TONEMAP_ACES EXPOSURE SATURATION VIGNETTE VIGNETTE_STRENGTH
screen.POST_SCREEN.comment=Configure ACES filmic tonemapping, exposure adaptation, saturation, and cinematic vignette.

# Sliders & Value Ranges
ATMOSPHERE_DENSITY.values=0.5 0.75 1.0 1.25 1.5 2.0
SUN_SIZE.values=0.5 0.75 1.0 1.25 1.5 2.0
SUN_CORONA_INTENSITY.values=0.0 0.5 1.0 1.2 1.5 2.0
