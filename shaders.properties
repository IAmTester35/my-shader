# ==============================================================================
# Celestial & Weather Shader Configuration GUI (Iris & Fabulously Optimized)
# ==============================================================================

# Iris Performance Profiles (Fabulously Optimized Quick Presets)
profiles = LOW MEDIUM HIGH ULTRA CINEMATIC

profile.LOW = VOLUMETRIC_CLOUD_STEPS:12 CLOUD_LAYERS:1 STARS_DENSITY:0.75 GODRAYS:false AURORA_BOREALIS:false METEOR_SHOWERS:false MILKY_WAY_BRIGHTNESS:0.6
profile.MEDIUM = VOLUMETRIC_CLOUD_STEPS:16 CLOUD_LAYERS:1 STARS_DENSITY:1.0 GODRAYS:true AURORA_BOREALIS:true METEOR_SHOWERS:true MILKY_WAY_BRIGHTNESS:0.75 GODRAYS_SAMPLES:16
profile.HIGH = VOLUMETRIC_CLOUD_STEPS:20 CLOUD_LAYERS:2 STARS_DENSITY:1.2 GODRAYS:true AURORA_BOREALIS:true METEOR_SHOWERS:true MILKY_WAY_BRIGHTNESS:0.75 GODRAYS_SAMPLES:20
profile.ULTRA = VOLUMETRIC_CLOUD_STEPS:28 CLOUD_LAYERS:2 STARS_DENSITY:1.35 GODRAYS:true AURORA_BOREALIS:true METEOR_SHOWERS:true MILKY_WAY_BRIGHTNESS:0.85 GODRAYS_SAMPLES:24
profile.CINEMATIC = VOLUMETRIC_CLOUD_STEPS:32 CLOUD_LAYERS:2 STARS_DENSITY:1.6 GODRAYS:true AURORA_BOREALIS:true METEOR_SHOWERS:true MILKY_WAY_BRIGHTNESS:1.0 GODRAYS_SAMPLES:32 SUN_CORONA_INTENSITY:1.8 MOON_HALO_INTENSITY:1.5 AURORA_INTENSITY:1.6

profile.default = HIGH

# Iris Fast Render & Buffer Directives
colortex0Format = RGBA16F
colortex0Clear = true

# Main Screen Layout
screen=BIOME_SCREEN SKY_SCREEN SUN_SCREEN MOON_SCREEN CLOUD_SCREEN WEATHER_SCREEN POST_SCREEN

# Category Screens
screen.BIOME_SCREEN=BIOME_ADAPTATION DESERT_SANDSTORM
screen.BIOME_SCREEN.comment=Configure biome-aware climate, atmospheric tinting, and desert sandstorms.

screen.SKY_SCREEN=ATMOSPHERE_DENSITY RAYLEIGH_SCATTERING MIE_SCATTERING OZONE_ABSORPTION BELT_OF_VENUS SKY_MULTI_SCATTERING SKY_GROUND_FOG
screen.SKY_SCREEN.comment=Configure Rayleigh and Mie atmospheric scattering, Chappuis ozone twilight, Belt of Venus, and horizon haze.

# Custom Textures (NASA SVS 4851 Deep Star Maps & Blue Noise)
texture.milkyway=/textures/milkyway.png
texture.constellations=/textures/constellations.png
texture.celestialgrid=/textures/celestialgrid.png
texture.noisetex=/textures/noisetex.png

screen.SUN_SCREEN=ENABLE_SUN SUN_SIZE SUN_LIMB_DARKENING SUN_ATMOSPHERIC_FLATTENING SUN_CHROMATIC_CORONA SUN_CORONA_INTENSITY SUN_GLARE SOLAR_DIFFRACTION_SPIKES GODRAYS GODRAYS_INTENSITY GODRAYS_SAMPLES
screen.SUN_SCREEN.comment=Configure procedural solar disc, atmospheric flattening, chromatic corona, diffraction starburst, and volumetric god rays.

screen.MOON_SCREEN=ENABLE_MOON MOON_SIZE MOON_PHASES MOON_SURFACE_DETAIL MOON_CRATER_RELIEF MOON_EARTHSHINE MOON_HALO MOON_HALO_INTENSITY ENABLE_STARS STARS_DENSITY STARS_TWINKLE STARS_COLOR_VARIETY NASA_SVS_MILKY_WAY MILKY_WAY MILKY_WAY_BRIGHTNESS MILKY_WAY_H_ALPHA CONSTELLATION_FIGURES CONSTELLATION_INTENSITY CELESTIAL_GRID CELESTIAL_GRID_INTENSITY CELESTIAL_LATITUDE METEOR_SHOWERS AURORA_BOREALIS AURORA_INTENSITY AURORA_RAY_STREAMERS
screen.MOON_SCREEN.comment=Configure moon 3D relief, ice-crystal halo, stars, NASA Milky Way H-alpha, meteors, and ray-streamer auroras.

screen.CLOUD_SCREEN=ENABLE_CLOUDS CLOUD_WMO_GENUS CLOUD_COVERAGE VOLUMETRIC_3D_CLOUDS VOLUMETRIC_CLOUD_STEPS CLOUD_LAYERS CLOUD_SPEED CLOUD_DENSITY CLOUD_SILVER_LINING CLOUD_SHADOWING CLOUD_ICE_HALO
screen.CLOUD_SCREEN.comment=Configure WMO 10 cloud genera (Auto/Cirrus/Cumulus/Cumulonimbus/etc.), coverage, true 3D raymarching, and optical effects.

screen.WEATHER_SCREEN=DYNAMIC_WEATHER RAIN_FOG_DENSITY STORM_LIGHTNING LIGHTNING_BOLTS LIGHTNING_BRANCH_GEN LIGHTNING_ROUGHNESS LIGHTNING_INTRA_CLOUD LIGHTNING_INTENSITY DESERT_SANDSTORM RAIN_STREAKS WETNESS_EFFECT
screen.WEATHER_SCREEN.comment=Configure rain fog, procedural CG/CC/IC lightning bolts, stepped leader branching depth, channel roughness, 3D intra-cloud illumination, desert sandstorms, wet surfaces, and raindrop optics.

screen.POST_SCREEN=TONEMAP_ACES EXPOSURE SATURATION VIGNETTE VIGNETTE_STRENGTH
screen.POST_SCREEN.comment=Configure ACES filmic tonemapping, exposure adaptation, saturation, and cinematic vignette.

